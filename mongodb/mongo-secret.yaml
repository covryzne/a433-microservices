# Menggunakan API core/v1 untuk membuat Secret.
apiVersion: v1

# Menentukan resource sebagai Secret untuk kredensial MongoDB.
kind: Secret

# Mendefinisikan identitas Secret.
metadata:
  # Nama Secret yang direferensikan oleh StatefulSet MongoDB.
  name: mongo-secret

  # Menempatkan Secret dalam namespace aplikasi Karsa Jobs.
  namespace: karsajobs

# Menyimpan data sensitif dalam Secret bertipe key-value.
type: Opaque

# Menyimpan kredensial dalam format Base64 sesuai format Kubernetes Secret.
# Base64 bukan enkripsi; gunakan pengelolaan secret yang lebih aman untuk produksi.
data:
  # Username root MongoDB: admin.
  MONGO_ROOT_USERNAME: YWRtaW4=

  # Password root MongoDB: supersecretpassword.
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
